name: Foundation checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate metadata without running commands
        run: python scripts/validate_experiments.py
      - name: Check out public Kit at the reviewed pin
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: SkylitAI/skylit-agent-kit
          ref: 0f82039759ef4db9d5b3dbd90f52863f8074f2a6
          path: .dependencies/kit
          persist-credentials: false
      - name: Test behavior and failure cases
        run: python -m unittest discover -s tests -v
        env:
          SKYLIT_AGENT_KIT: ${{ github.workspace }}/.dependencies/kit
      - name: Check syntax
        run: python -m compileall -q scripts tests templates/experiment experiments
      - name: Run the reviewed synthetic template
        run: |
          python templates/experiment/run.py --output /tmp/lab-example.md
          diff -u templates/experiment/expected.md /tmp/lab-example.md

  offline-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Check out public Kit at the reviewed pin
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: SkylitAI/skylit-agent-kit
          ref: 0f82039759ef4db9d5b3dbd90f52863f8074f2a6
          path: .dependencies/kit
          persist-credentials: false
      - name: Prove isolation and evaluate all offline seeds
        run: python scripts/run_isolated.py --kit .dependencies/kit --evaluate
