name: Foundation checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate metadata without running commands
        run: python scripts/validate_experiments.py
      - name: Explain hosted integration coverage
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ### Kit integration coverage
          This job does not check out the internal Kit repository. Kit-dependent
          skips in the test output are unverified hosted coverage, even when the
          job passes. See docs/checks.md for the pinned local verification and
          the separate cross-repository access prerequisite.
          EOF
      - name: Test behavior and failure cases
        run: python -m unittest discover -s tests -v
      - name: Check syntax
        run: python -m compileall -q scripts tests templates/experiment experiments
      - name: Run the reviewed synthetic template
        run: |
          python templates/experiment/run.py --output /tmp/lab-example.md
          diff -u templates/experiment/expected.md /tmp/lab-example.md

  offline-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Prove isolation and run independent offline seeds (Kit unverified)
        run: python scripts/run_isolated.py --without-kit
